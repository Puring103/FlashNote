[package]
name = "suojian-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
gpui-note-editor = { path = "../gpui-note-editor", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
diffy = "0.4"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
fs2 = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
strsim = "0.11"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
[target.'cfg(windows)'.dependencies]
html2md = "0.2"
windows = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_DataExchange"] }
[dev-dependencies]
tempfile = "3"
