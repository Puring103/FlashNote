[package]
name = "suojian"
version = "0.12.0"
edition = "2024"
license = "MIT"
default-run = "suojian"
autobins = false

[lib]
path = "apps/desktop/src/lib.rs"

[[bin]]
name = "suojian"
path = "apps/desktop/src/main.rs"

[[bin]]
name = "suojian-sync"
path = "apps/desktop/src/bin/suojian-sync.rs"

[[bin]]
name = "flashnote"
path = "apps/desktop/src/bin/flashnote.rs"

[workspace]
members = ["crates/gpui-note-editor", "crates/flashnote-core", "crates/flashnote-android"]
default-members = [".", "crates/gpui-note-editor", "crates/flashnote-core"]
exclude = ["crates/gpui-component", "crates/gpui"]
resolver = "2"

[patch.crates-io]
gpui = { path = "crates/gpui" }
gpui-component = { path = "crates/gpui-component" }

[dependencies]
suojian-core = { path = "crates/flashnote-core" }
gpui-note-editor = { path = "crates/gpui-note-editor" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
anyhow = "1"
gpui = "=0.2.2"
gpui-component = "=0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
zeroize = { version = "1", features = ["derive"] }
webbrowser = "1"
directories = "6"
clap = { version = "4", features = ["derive"] }
unicode-normalization = "0.1"
url = "2"
tempfile = "3"
rfd = "0.15"
cpal = "0.15"
hound = "3.5"
rodio = "0.20"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
raw-window-handle = "0.6"
windows = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "linux")'.dependencies]
fs2 = "0.4"
futures-lite = "2"
oo7 = { version = "0.5", default-features = false, features = ["async-std", "native_crypto"] }

[profile.dev]
debug = 0

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.release]
strip = true
lto = "thin"
